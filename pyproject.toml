[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "subsurfix"
dynamic = ["version"]
description = "A tool for automation in subsurface geological/petrophysical analysis and geomodeling workflows"
authors = [{ name = "Larry Syu-Heng Lai" }]
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = ["numpy>=1.26.4", "pyarrow>=25.0.0", "pyproj>=3.6", 'tomli>=2.0; python_version < "3.11"']
keywords = ["well logs", "petrophysics", "stratigraphic correlation", "geostatistics", "reservoir simulation", "geomodeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/GeoLarryLai/SubsurfiX"
Repository = "https://github.com/GeoLarryLai/SubsurfiX"
Issues = "https://github.com/GeoLarryLai/SubsurfiX/issues"

[project.optional-dependencies]
gis = ["pyproj>=3.8.0", "shapely>=2.1.2", "pyshp>=3.1.6", "openpyxl>=3.1.5"]
xls = ["python-calamine>=0.4.0"]
test = ["pytest>=9.1.1"]

[tool.maturin]
manifest-path = "crates/sx-py/Cargo.toml"
module-name = "subsurfix._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-m 'not data'"
markers = [
    "data: needs bigger fixtures from SX_DATA_FIXTURES; run with -m data",
]
