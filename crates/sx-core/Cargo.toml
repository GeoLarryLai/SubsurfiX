[package]
name = "sx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow = { version = "60.0.0", default-features = false }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
delaunator = "1.1.0"
faer = "0.24.4"
hex = "0.4.3"
kiddo = "6.3.0"
las_rs = { version = "=0.2.1", default-features = false }
lightgbm3 = { version = "1.0.11", features = ["openmp"] }
lightgbm3-sys = "=1.0.11"
petgraph = "0.8.3"
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
thiserror = "2.0.21"
tracing = "0.1.44"
